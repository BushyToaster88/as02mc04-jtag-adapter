<svg xmlns="http://www.w3.org/2000/svg" width="210.0mm" height="297.0mm" viewBox="0 0 210.0 297.0">
<rect x="0" y="0" width="210.0" height="297.0" fill="#fff"/>
<text x="18.000" y="20.000" font-family="DejaVu Sans, Arial, sans-serif" font-size="6.0" text-anchor="start" font-weight="bold" fill="#000">Pin pitch gauge: card header J4 and the Digilent HS3 plug</text>
<text x="18.000" y="27.000" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.2" text-anchor="start" font-weight="normal" fill="#000">Print at 100 % (actual size). Do not use fit to page.</text>
<text x="18.000" y="36.500" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.0" text-anchor="start" font-weight="bold" fill="#000">Step 1. Check the print scale: this bar must measure exactly 100 mm.</text>
