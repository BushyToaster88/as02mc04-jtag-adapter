<text x="53.200" y="104.700" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.2" text-anchor="start" font-weight="normal" fill="#000">12.70 mm between the centres of the two end pins</text>
<text x="38.000" y="114.500" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.4" text-anchor="start" font-weight="bold" fill="#000">Row B: 2.00 mm pitch</text>
<text x="38.000" y="118.800" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">If the pins match this row instead, stop: the adapter's socket will not fit. Do not order.</text>
