<text x="38.000" y="199.500" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.4" text-anchor="start" font-weight="bold" fill="#000">Pattern D: 2.54 mm pitch</text>
<text x="38.000" y="203.800" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">If the holes match this pattern instead, stop: this is not the Xilinx 2 mm plug. Do not order.</text>
