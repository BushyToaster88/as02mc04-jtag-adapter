<text x="18.000" y="152.000" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.0" text-anchor="start" font-weight="bold" fill="#000">Step 3. HS3 plug (two rows of seven holes). Hold the end of the HS3 against each pattern.</text>
