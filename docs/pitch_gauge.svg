<text x="55.740" y="220.740" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.2" text-anchor="start" font-weight="normal" fill="#000">15.24 mm between the first and last hole of a row, rows 2.54 mm apart</text>
<text x="18.000" y="235.000" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.4" text-anchor="start" font-weight="bold" fill="#000">Without a printer</text>
<text x="18.000" y="242.000" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">Card header J4, centre of pin 1 to centre of pin 6</text>
<text x="128.000" y="242.000" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="bold" fill="#000">12.70 mm = correct</text>
<text x="166.000" y="242.000" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">10.00 mm = wrong</text>
<text x="18.000" y="247.600" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">Card header J4, outside faces of the two end pins (calipers)</text>
<text x="128.000" y="247.600" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="bold" fill="#000">13.3 mm = correct</text>
<text x="166.000" y="247.600" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">10.5 mm = wrong</text>
<text x="18.000" y="253.200" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">HS3 plug, centre of the first hole to centre of the seventh in a row</text>
<text x="128.000" y="253.200" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="bold" fill="#000">12.00 mm = correct</text>
<text x="166.000" y="253.200" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">15.24 mm = wrong</text>
<text x="18.000" y="258.800" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">HS3 plug, centre of one row to centre of the other</text>
<text x="128.000" y="258.800" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="bold" fill="#000">2.00 mm = correct</text>
<text x="166.000" y="258.800" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">2.54 mm = wrong</text>
<text x="18.000" y="266.500" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">Fit test for J4: a standard 0.1 inch jumper wire housing is 2.54 mm wide. Six side by side, or one 1x6 housing,</text>
<text x="18.000" y="271.300" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">should slide onto all six pins without spreading apart or bending a pin.</text>
<text x="18.000" y="278.500" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">The pin at the 1V8 end of J4 is slightly bent on some cards. Straighten it gently before measuring.</text>
</svg>
