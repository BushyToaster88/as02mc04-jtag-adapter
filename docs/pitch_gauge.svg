<line x1="98.000" y1="41.200" x2="98.000" y2="44.800" stroke="#000" stroke-width="0.25"/>
<text x="98.000" y="50.200" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#000">80</text>
<line x1="108.000" y1="41.200" x2="108.000" y2="44.800" stroke="#000" stroke-width="0.25"/>
<text x="108.000" y="50.200" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#000">90</text>
<line x1="118.000" y1="40.000" x2="118.000" y2="46.000" stroke="#000" stroke-width="0.25"/>
<text x="118.000" y="50.200" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#000">100</text>
<text x="18.000" y="55.500" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">If it is not 100 mm the printer rescaled the page. Reprint before trusting the marks below.</text>
<text x="18.000" y="68.000" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.0" text-anchor="start" font-weight="bold" fill="#000">Step 2. Card header J4 (six pins in a row). Lay the pins on each row. Only one row will match.</text>
<text x="38.000" y="80.500" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.4" text-anchor="start" font-weight="bold" fill="#000">Row A: 2.54 mm pitch</text>
<text x="38.000" y="84.800" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.3" text-anchor="start" font-weight="normal" fill="#000">What the adapter is built for. All six pins should sit on the six black squares.</text>
